[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
solc = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./"}, { access = "read", path = "../"}]

remappings = [
    "@reactive/=../lib/reactive-lib-omni/",
    "forge-std/=../lib/forge-std/src/",
]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
lasna = "https://lasna-rpc.rnk.dev/"
base_sepolia = "${BASE_SEPOLIA_RPC}"
sepolia = "${SEPOLIA_RPC}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }